name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test plant care and history logic
        working-directory: tests
        run: |
          node test.cjs
          node test-timeline.cjs
          node test-reservoir.cjs
          node test-offline.cjs
          node test-history.cjs
      - name: Check Android build
        run: ./gradlew --no-daemon lintRelease testReleaseUnitTest assembleRelease
      - name: Build signed APK for existing Rooted installations
        id: signing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ROOTED_KEYSTORE_BASE64 }}
          ROOTED_STORE_PASSWORD: ${{ secrets.ROOTED_STORE_PASSWORD }}
          ROOTED_KEY_ALIAS: ${{ secrets.ROOTED_KEY_ALIAS }}
          ROOTED_KEY_PASSWORD: ${{ secrets.ROOTED_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'Signing is pending: the unsigned artifact cannot be installed.' >> "$GITHUB_STEP_SUMMARY"
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export ROOTED_KEYSTORE="$RUNNER_TEMP/rooted-signing.keystore"
          trap 'rm -f "$ROOTED_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ROOTED_KEYSTORE"
          export ROOTED_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon assembleRelease
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk "apk/rooted-build-${GITHUB_RUN_NUMBER}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs apk/*.apk
          cd apk
          sha256sum *.apk > SHA256SUMS.txt
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - name: Downloadable APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rooted-apk-${{ github.run_number }}
          path: apk/
          if-no-files-found: error
          retention-days: 30
      - name: Unsigned build pending signing setup
        if: steps.signing.outputs.signed == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rooted-UNSIGNED-not-installable-${{ github.run_number }}
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Android check reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-check-reports-${{ github.run_number }}
          path: app/build/reports/
          retention-days: 7

  release:
    name: Publish signed APK as GitHub Release
    needs: build
    # Only real pushes to main whose build job produced a verified signed APK.
    # Pull requests, manual runs and unsigned builds never publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: android-release
      cancel-in-progress: false
    steps:
      - name: Download signed APK artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rooted-apk-${{ github.run_number }}
          path: apk
      - name: Prepare rooted.apk and checksums
        id: prepare
        run: |
          set -euo pipefail
          src="apk/rooted-build-${GITHUB_RUN_NUMBER}.apk"
          test -f "$src"
          (cd apk && sha256sum --check SHA256SUMS.txt)
          mkdir -p release
          cp "$src" release/rooted.apk
          # Defence in depth: refuse to publish anything that does not verify as signed.
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify release/rooted.apk
          cd release
          sha256sum rooted.apk > SHA256SUMS.txt
          echo "sha256=$(cut -d ' ' -f 1 SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          SHA256: ${{ steps.prepare.outputs.sha256 }}
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          Signed Rooted APK built by GitHub Actions run ${GITHUB_RUN_NUMBER}.

          - Commit: ${GITHUB_SHA}
          - SHA256 (rooted.apk): ${SHA256}

          Latest build: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/rooted.apk
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Re-run of the same workflow run: replace the assets instead of failing.
            gh release upload "$TAG" release/rooted.apk release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/rooted.apk release/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Rooted build ${GITHUB_RUN_NUMBER}" \
              --notes-file notes.md \
              --latest
          fi
